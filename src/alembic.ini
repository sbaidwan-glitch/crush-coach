# Alembic config. Run alembic from src/ (see CLAUDE.md > Commands).
# The database URL is NOT set here: migrations/env.py reads it from db.py
# (DATABASE_URL in the environment), so no secret ever lands in this file.

[alembic]
script_location = %(here)s/migrations
# env.py imports db and models, which live next to this file.
prepend_sys_path = %(here)s
path_separator = os
