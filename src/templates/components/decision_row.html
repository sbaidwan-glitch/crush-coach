{# One recorded answer as a row: what it is about and the answer, linking to its place in the Record.
   `d` is a Decision. #}
{% macro decision_row(d) -%}
<div class="decision">
  <a href="/decisions/{{ d.id }}">{{ d.topic }}</a>
  <div class="task-row__meta">{{ d.subsystem }}</div>
  <p class="decision__summary">{{ d.decision }}</p>
</div>
{%- endmacro %}
