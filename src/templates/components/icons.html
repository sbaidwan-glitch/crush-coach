{# Sidebar icons. Each is decorative (aria-hidden): the link always carries a visible label. #}
{% macro nav_icon(name) -%}
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  {%- if name == "home" -%}<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>
  {%- elif name == "tasks" -%}<path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6h2M3 12h2M3 18h2"/>
  {%- elif name == "decisions" -%}<rect x="3" y="3" width="18" height="18"/><path d="M8 12l3 3 5-6"/>
  {%- elif name == "admin" -%}<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>
  {%- endif -%}
</svg>
{%- endmacro %}

{% macro logo() -%}
