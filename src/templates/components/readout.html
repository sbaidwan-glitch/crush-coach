{# Facts as labelled boxes: a small uppercase label over a field. `cells` is a list of dicts:
   {"label": ..., "value": ..., "muted": True (dimmer value)}. #}
{% macro readout(cells) -%}
{%- for c in cells %}
<div class="field-label">{{ c.label }}</div>
<div class="field{% if c.muted %} meta{% endif %}">{{ c.value }}</div>
{%- endfor %}
{%- endmacro %}
