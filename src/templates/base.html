<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Crush Coach{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header>
      <p class="team">MuddSub mechanical team</p>
      <nav aria-label="Main">
        <a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Home</a>
        <a href="/tasks"{% if request.url.path == "/tasks" %} aria-current="page"{% endif %}>Tasks</a>
        {% if user %}
        <span class="signed-in">
          {{ user.name }}{% if user.role == "lead" %} (lead){% endif %}
        </span>
        <a href="/logout">Log out</a>
        {% else %}
        <a href="/login">Sign in with Google</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% block main %}{% endblock %}
    </main>
    <footer>
      <p>Task tracker for Crush, the MuddSub AUV.</p>
    </footer>
  </body>
</html>
