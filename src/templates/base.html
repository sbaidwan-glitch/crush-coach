<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Crush Coach{% endblock %}</title>
    <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/coach.js" defer></script>
  </head>
  <body>
    <header>
      <p class="team">MuddSub mechanical team</p>
      <nav aria-label="Main">
        <a href="/">Home</a>
        <a href="/tasks"{% if request.url.path == "/tasks" %} aria-current="page"{% endif %}>Tasks</a>
      </nav>
    </header>
    <main>
      {% block main %}{% endblock %}
    </main>
    <footer>
      <p>Task tracker for Crush, the MuddSub AUV.</p>
    </footer>
  </body>
</html>
