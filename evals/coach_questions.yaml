# Coach test questions ("evals"). `make eval` runs every question through the coach
# and scores it. Samara: check every `expect` line against what you actually know.
# Edit, delete or add questions. Aim for 15-20 that a real member would ask.
#
# Fields
#   id          short unique name
#   task        task code the question is asked from (gives the coach the task context)
#   question    exactly what a member would type
#   expect      facts that must appear in a good answer (case-insensitive substring).
#               An item can be a list of alternatives, any one of which counts:
#               ["not decided", "no decision"]. Use that when a right answer can be
#               worded several ways.
#   cite        a file/doc name the answer should link (substring match)
#   must_not    things a good answer must NOT do (phrases or behaviors)
#   kind        lookup | how-to | why | conflict | unknown
#               (conflict = sources disagree; unknown = nothing in the Drive answers it)
#
# Drafted from documents already seen in the Drive. VERIFY each one.

- id: lid-latch
  task: M08
