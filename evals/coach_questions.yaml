# Coach test questions ("evals"). `make eval` runs every question through the coach
# and scores it. Samara: check every `expect` line against what you actually know.
# Edit, delete or add questions. Aim for 15-20 that a real member would ask.
#
# Fields
#   id          short unique name
#   task        task code the question is asked from (gives the coach the task context)
#   question    exactly what a member would type
#   expect      facts that must appear in a good answer (case-insensitive substring).
#               An item can be a list of alternatives, any one of which counts:
#               ["not decided", "no decision"]. Use that when a right answer can be
#               worded several ways.
#   cite        a file/doc name the answer should link (substring match)
#   must_not    things a good answer must NOT do (phrases or behaviors)
#   kind        lookup | how-to | why | conflict | unknown | follow-up | recommend | plan
#               (conflict = sources disagree; unknown = nothing in the Drive answers it;
#               follow-up = a second message in the same chat, see `after`)
#   recommend   (true on one question) asked like pressing the Recommend button after
#               `after`: the coach searches the reference books and calculates.
#               `question` is then the button's own text, "Give me your recommendation."
#   plan        (true on a plan question) asked like pressing "Plan my next steps" after
#               `after`: one short call, no tools, a fixed shape (What I found, What's
#               missing, Do this now, If you need more help, You should end up with) and
#               then the app's own "Then" from the task's steps. `question` is the button's
#               own text, "Plan my next steps." The answer should stay under about 250 tokens.
#   after       (follow-ups only) the id of an earlier question. It is asked in the same
#               chat, after that question and its answer, the way a member would type it.
#               Running a follow-up with ONLY=<id> asks the question it follows too.
#
# Drafted from documents already seen in the Drive. VERIFY each one.

