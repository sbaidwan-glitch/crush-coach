  after: gasket-clearance
  recommend: true
  question: Give me your recommendation.
  expect: ["Recommendation", "0.030", ["Parker", "handbook", "Gasket Selection Notes", "General engineering"]]
  cite: ""
  must_not: ["couldn't put an answer together", "which season"]
  kind: recommend

# Plans: the "Plan my next steps" button after an answer. Every plan has the five parts the
# coach writes and the "Then" the app adds. It should say what the Drive already holds
# (with the sources), what is missing, one thing to do now, and a prompt to paste elsewhere.
- id: lid-latch-plan
  task: M08
  after: lid-latch
  plan: true
  question: Plan my next steps.
  expect: ["What I found", "What's missing", "Do this now", "If you need more help", "You should end up with", "Then", "6082A12"]
  cite: "6082A12_Draw Latch"
  must_not: ["which season", "should I search", "couldn't put an answer together"]
  kind: plan

