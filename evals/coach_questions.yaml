  question: Can you explain what that means and what I should look for?
  # The point is a non-empty, on-topic follow-up that keeps the first answer's numbers.
  expect: ["0.030", "0.050"]
  cite: ""
  must_not: ["couldn't put an answer together"]
  kind: follow-up

